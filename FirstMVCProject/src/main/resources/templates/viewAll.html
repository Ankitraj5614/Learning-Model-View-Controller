<!DOCTYPE html>
<html       
 xmlns:th="http://www.thymeleaf.org" 
 th:replace="~{baseui::mybaseLayout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<section>
		
		<div >
		<div class="container mt-5">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">User Management</h3>
        </div>

        <div class="card-body">

            <input type="text"
                   id="search"
                   class="form-control mb-4"
                   placeholder="Search User...">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>PAN</th>
                        <th>Address</th>
                        <th>Aadhar</th>
                        <th width="320">Action</th>
                    </tr>

                    </thead>

                    <tbody id="tableBody">

                    <tr th:each="user:${userpage.content}">

                        <td th:text="${user.name}"></td>
                        <td th:text="${user.email}"></td>
                        <td th:text="${user.pan}"></td>
                        <td th:text="${user.address}"></td>
                        <td th:text="${user.aadhar}"></td>

                        <td>

                            <a th:href="@{/edit/{id}(id=${user.id})}"
                               class="btn btn-warning btn-sm me-2">
                                ✏ Edit
                            </a>

                            <a th:href="@{/delete/{id}(id=${user.id})}"
                               class="btn btn-danger btn-sm me-2 deleteBtn">
                                🗑 Delete
                            </a>

                            <a th:href="@{/download/{id}(id=${user.id})}"
                               class="btn btn-info btn-sm text-white">
                                ⬇ Download
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
				</div>

</section>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
